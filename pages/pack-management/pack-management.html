<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="../icons/icon-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="./pack-management.css" />

    <title>PianoBingo</title>
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../styles.css" />
</head>
<body>
    <div id="app">
        <div class="nav-bar">
            <div class="back-container nav-bar-left">
                <button onclick="back()">Back</button>
            </div>
            <h1>Manage Playlists</h1>
        </div>
        <div>
            <div id='playlust-container' class="playlist-container"></div>
            <div style="width: 100%; display: flex; justify-content: center; align-items: center;">
                <button class="create-button" onclick="handleCreateNewPack()">Create New</button>
            </div>
        </div>
    </div>
    <script>

        function back(){
            loadPage(PAGE.WELCOME)
        }

        function renderPage() {
            generateRadioButtonsFromPacks();
        }

        async function generateRadioButtonsFromPacks() {
            const container = document.querySelector('.playlist-container');
            if (!container) return;

            const packData = await loadAllPacks();

            container.innerHTML = packData.map((pack) => {
                return `
                <div class="playlist-row">
                    <input 
                        type="text" 
                        class="playlist-name-input"
                        value="${pack.packName}" 
                        onblur="handleRenamePack(${pack.packId}, this.value)"
                    />
                    <div class="playlist-actions">
                        <button class="edit-btn" onClick="handleEditPack(${pack.packId})">✏️</button>
                        <button class="delete-btn" onClick="handleDeletePack(${pack.packId})">🗑️</button>
                    </div>
                </div>
            `;
            }).join('');
        }

        async function handleCreateNewPack() {
            const packData = await loadAllPacks();
            const maxPackId = Math.max(...packData.map(item => item.packId));
            const newPack = {
                packId: Math.max(maxPackId + 1, INDEXED_BD_CONFIG.PARTITION_SIZE),
                packName: "New Pack"
            };

            await savePack(newPack);
            await renderPage();
        }

        async function handleDeletePack(idToRemove) {
            await deletePack(idToRemove);
            await renderPage();
        }

        function handleEditPack(packId) {
            selectPack(packId);
            loadPage(PAGE.PACK_EDIT);
        }

        async function handleRenamePack(packId, newName) {
            const packs = await loadAllPacks();
            const pack = packs.find(p => p.packId === packId);

            if (pack) {
                pack.packName = newName.trim() || "Untitled Pack"; // fallback if empty
                await savePack(pack);
            }
    }

    </script>
    <script src="../../app.js"></script>
    <script src="../../services/navigation/navigation.js"></script>
    <script src="../../../resources/base64/pack_tom.js"></script>  <!-- Must Load before gameStorage -->
    <script src="../../resources/base64/pack_jack.js"></script>  <!-- Must Load before gameStorage -->
    <script src="../../../resources/state-helpers/gameStorage.js"></script>  
    <script>renderPage()</script>
</body>
</html>
