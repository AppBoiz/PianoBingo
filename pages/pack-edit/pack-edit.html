<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="../icons/icon-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="./pack-edit.css" />

    <title>PianoBingo</title>
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../styles.css" />
</head>
<body>
    <div id="app">
        <div class="nav-bar">
            <div class="back-container nav-bar-left">
                <button onclick="back()">Back</button>
            </div>
            <h1>Edit Pack</h1>
        </div>
        <div>
            <div id='playlust-container' class="playlist-container"></div>
            <div style="width: 100%; display: flex; justify-content: center; align-items: center;">
                <button class="create-button" onclick="handleCreateNewPack()">Create New</button>
            </div>
        </div>
    </div>
    <script>

        function back(){
            startNewGame();
            loadPage(PAGE.PACK_MANAGEMENT);
        }

        function renderPage() {
            generateRadioButtonsFromSongs();
        }

        async function generateRadioButtonsFromSongs() {
            const container = document.querySelector('.playlist-container');
            if (!container) return;
            
            debugger;
            const selectedSongPackId = getSelectedSongPackId();
            const packData = await loadPack(selectedSongPackId);
             container.innerHTML = packData.map((pack, index) => {
                
                return `
                 <div class="playlist-row">
                    <span class="playlist-name">${pack.packName}</span>
                    <div class="playlist-actions">
                    <button class="edit-btn">✏️</button>
                    <button class="delete-btn" onClick="handleDeletePack(${pack.packId})">🗑️</button>
                    </div>
                </div>
             `}).join('');
        }

        function handleCreateNewPack() {
            const maxPackId = Math.max(...packData.map(item => item.packId));
            const newPack = {
                packId: Math.max(maxPackId + 1, INDEXED_BD_CONFIG.PARTITION_SIZE),
                packName: "New Pack"
            };
            // TODO: Write Pack To Local Storage
            packData.push(newPack);
            renderPage();
        }

        function handleDeletePack(idToRemove) {
            const newPacksList = packData.filter(pack => pack.packId != idToRemove);
            
            // TODO: Delete Pack From Local Storage
            packData = newPacksList;
            renderPage();
        }

    </script>
    <script src="../../app.js"></script>
    <script src="../../services/navigation/navigation.js"></script>
    <script src="../../../resources/base64/pack_tom.js"></script>  <!-- Must Load before gameStorage -->
    <script src="../../resources/base64/pack_jack.js"></script>  <!-- Must Load before gameStorage -->
    <script src="../../../resources/state-helpers/gameStorage.js"></script>  
    <script>renderPage()</script>
</body>
</html>
