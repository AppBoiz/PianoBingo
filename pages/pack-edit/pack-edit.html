<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="../icons/icon-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="./pack-edit.css" />

    <title>PianoBingo</title>
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../styles.css" />
</head>
<body>
    <div id="app"> 
        <div class="nav-bar">
            <div class="back-container nav-bar-left">
                <button onclick="back()">Back</button>
            </div>
            <h1>Edit Pack</h1>
            <div id="song-counter" class="nav-bar-right">0/75</div>
        </div>

        <!-- scrollable section -->
        <div class="main-content">
            <div id="playlust-container" class="playlist-container" style="flex-grow: 1;"></div>
        </div>

        <!-- footer -->
        <div class="footer">
            <button class="primary-btn">Ok</button>
        </div>

    </div>
    <script>

        function back(){
            startNewGame();
            loadPage(PAGE.PACK_MANAGEMENT);
        }

        function renderPage() {
            generateSongSlots();
        }

        let packData = undefined;

        async function generateSongSlots() {
            const container = document.querySelector('.playlist-container');
            const counterEl = document.getElementById("song-counter");
            const okButton = document.querySelector(".primary-btn");
            if (!container) return;
            
            const selectedSongPackId = getSelectedSongPackId();

            if (packData === undefined) {
                packData = await loadPack(selectedSongPackId);
            }
            const songData = await loadAllSongs();

            if (!packData.songs) {
                packData.songs = []; // array of songIds by slot
            }

            // ensure the songs array always has 75 slots
            if (packData.songs.length < 75) {
                packData.songs.length = 75; // fills missing entries with undefined
            }

            const total = 75;
            const selected = packData.songs.filter(id => id !== undefined && id !== null).length;
            counterEl.textContent = `${selected}/${total}`;

            // enable/disable Ok button
            okButton.disabled = selected !== total;

            // attach callback to Ok button
            okButton.onclick = () => {
                if (selected === total) {
                    savePack(packData);  
                    loadPage(PAGE.PACK_MANAGEMENT); 
                }
            };

            // render 75 slots (with blanks where no song is assigned)
            container.innerHTML = packData.songs.map((songId, index) => {
                const song = songData.find(s => s.songId === songId);
                return `
                    <div class="playlist-row" data-song-id="${songId || ''}">
                        <span>${index + 1}</span>
                        <span class="playlist-name">${song ? song.title : ""}</span>
                    </div>
                `;
            }).join('');
        }

        function handleCreateNewPack() {
            const maxPackId = Math.max(...packData.map(item => item.packId));
            const newPack = {
                packId: Math.max(maxPackId + 1, INDEXED_BD_CONFIG.PARTITION_SIZE),
                packName: "New Pack",
                songs: new Array(75).fill(undefined) // create 75 empty slots
            };
            packData.push(newPack);
            renderPage();
        }

        function handleDeletePack(idToRemove) {
            const newPacksList = packData.filter(pack => pack.packId != idToRemove);
            packData = newPacksList;
            renderPage();
        }

    </script>
    <script src="../../app.js"></script>
    <script src="../../services/navigation/navigation.js"></script>
    <script src="../../../resources/base64/pack_tom.js"></script>
    <script src="../../resources/base64/pack_jack.js"></script>
    <script src="../../../resources/state-helpers/gameStorage.js"></script>  
    <script>renderPage()</script>
</body>
</html>
