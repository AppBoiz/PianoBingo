<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="../icons/icon-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="./song-management.css" />

    <title>PianoBingo</title>
    <link rel="manifest" href="../../manifest.json">
    <link rel="stylesheet" href="../../styles.css" />
</head>
<body>
    <div id="app"> 
        <div class="nav-bar">
            <div class="back-container nav-bar-left">
                <button onclick="back()">Back</button>
            </div>
            <h1>Manage Songs</h1>
        </div>

        <!-- scrollable section -->
        <div class="main-content">
            <div id="playlust-container" class="playlist-container" style="flex-grow: 1;"></div>
        </div>

        <!-- footer -->
        <div class="footer">
            <button class="primary-btn" onclick="handleCreateNewSong()">➕ New Song</button>
        </div>

    </div>
    <script>

        function back(){
            startNewGame();
            loadPage(PAGE.WELCOME);
        }

        function renderPage() {
            generateRadioButtonsFromSongs();
        }

        function renderPage() {
            generateCheckListFromSongs();
        }

        let packData = undefined;

        async function generateCheckListFromSongs() {
            const container = document.querySelector('.playlist-container');
            const okButton = document.querySelector(".primary-btn");
            if (!container) return;

            const songData = await loadAllSongs();

            container.innerHTML = songData.map((song) => {
                const hasPdf = !!song.pdfUrl;
                return `
                    <div class="playlist-row">
                        <span class="playlist-name">${song.songId}</span>
                        <input 
                            type="text" 
                            class="playlist-name-input"
                            value="${song.title}" 
                            onblur="handleRenamePack(${song.songId}, this.value)"
                        />
                        <div class="playlist-actions">
                            ${hasPdf 
                                ? `
                                    <button class="pdf-btn" data-song-id="${song.songId}">📄 View PDF</button>
                                    <button class="remove-pdf-btn" data-song-id="${song.songId}">❌ Remove PDF</button>
                                `
                                : `<input type="file" accept="application/pdf" class="pdf-upload" data-song-id="${song.songId}"/>`
                            }
                            <button class="delete-btn" onClick="handleDeleteSong(${song.songId})">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');

            // 🎵 Title editing listeners
            container.querySelectorAll(".playlist-title-input").forEach(input => {
                input.addEventListener("blur", (e) => {
                    const songId = parseInt(e.target.getAttribute("data-song-id"), 10);
                    const song = songData.find(s => s.songId === songId);
                    if (song) {
                        song.title = e.target.value.trim() || "Untitled Song";
                        saveSong(song);
                        // no need to re-render on every blur (keeps input focus)
                    }
                });

                // Optional: Save on Enter
                input.addEventListener("keydown", (e) => {
                    if (e.key === "Enter") {
                        e.target.blur(); // triggers blur handler
                    }
                });
            });

            // attach listeners to PDF upload inputs
            container.querySelectorAll(".pdf-upload").forEach(input => {
                input.addEventListener("change", async (e) => {
                    const songId = parseInt(e.target.getAttribute("data-song-id"), 10);
                    const file = e.target.files[0];
                    if (file) {
                        const base64 = await fileToBase64(file);
                        const song = songData.find(s => s.songId === songId);
                        if (song) {
                            song.pdfUrl = base64;
                            saveSong(song);
                            renderPage(); // re-render to show "View PDF" button
                        }
                    }
                });
            });

            // attach listeners to PDF view buttons
            container.querySelectorAll(".pdf-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const songId = parseInt(e.target.getAttribute("data-song-id"), 10);
                    const song = songData.find(s => s.songId === songId);
                    if (song && song.pdfUrl) {
                        const link = document.createElement("a");
                        link.href = song.pdfUrl;
                        link.download = `${song.title || "song"}.pdf`;
                        link.target = "_blank";
                        link.click();
                    }
                });
            });

            // attach listeners to PDF remove buttons
            container.querySelectorAll(".remove-pdf-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const songId = parseInt(e.target.getAttribute("data-song-id"), 10);
                    const song = songData.find(s => s.songId === songId);
                    if (song) {
                        song.pdfUrl = null; // remove PDF
                        saveSong(song);
                        renderPage(); // refresh row to show upload input again
                    }
                });
            });
            
        }

        function handleCreateNewSong() {
            loadAllSongs().then(songData => {
                const maxSongId = songData.length > 0 ? Math.max(...songData.map(item => item.songId)) : 0;
                const newSong = {
                    songId: maxSongId + 1,
                    title: "New Song",
                    pdfUrl: null
                };

                saveSong(newSong); // <-- persist new song
                renderPage(); // refresh to show it
            });
        }

        function handleEditSong(songId) {
            // selectPack(packId);
            loadPage(PAGE.SONG_EDIT);
        }

        function handleDeleteSong(songId) {
            deleteSong(songId);
            renderPage(); // re-render list after deletion
        }

    </script>
    <script src="../../app.js"></script>
    <script src="../../services/navigation/navigation.js"></script>
    <script src="../../../resources/base64/pack_tom.js"></script>  <!-- Must Load before gameStorage -->
    <script src="../../resources/base64/pack_jack.js"></script>  <!-- Must Load before gameStorage -->
    <script src="../../../resources/state-helpers/gameStorage.js"></script>  
    <script>renderPage()</script>
</body>
</html>
