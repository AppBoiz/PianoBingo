<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512x512.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="stylesheet" href="./pack-select.css" />

    <title>PianoBingo</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div id="app">
        <div class="back-container">
            <button onclick="back()">Back</button>
        </div>
        <h1>Create New Game</h1>
        <h2>Select Song Pack</h2>
        <div class="flex-col mb-40">
            <div class="radios-container">
            </div>
        </div>
        <button class="select-button" onclick="pickPack()">Start Game</button>
        <img class="piano-banner" src="/resources/images/piano.png">
    </div>
    <script>
        async function pickPack(){
            var radios = document.getElementsByName('radio');
            let radioVal = 1;

            for (var i = 0, length = radios.length; i < length; i++) {
                if (radios[i].checked) {
                    radioVal = parseInt(radios[i].value);
                    break;
                }
            }

            selectPack(radioVal);
            await generateSong();
            loadPage(PAGE.GAME);
        }

        function back(){
            clearGameState();
            loadPage(PAGE.WELCOME);
        }

        async function generateRadioButtonsFromPacks() {
            const container = document.querySelector('.radios-container');
            if (!container) return;

            const packData = await loadAllPacks();

            container.innerHTML = packData.map((pack, index) => `
                <label class="radio-label">
                <input type="radio" name="radio" value="${pack.packId}" ${index === 0 ? 'checked="checked"' : ''}/>
                ${pack.packName}
                </label>
            `).join('');
        }
    </script>
    <script src="/app.js"></script>
    <script src="/services/navigation/navigation.js"></script>
    <script src="/resources/base64/pack_tom.js"></script>
    <script src="/resources/base64/pack_jack.js"></script>
    <script src="/resources/state-helpers/gameStorage.js"></script>  
    <script>generateRadioButtonsFromPacks()</script>
</body>
</html>
