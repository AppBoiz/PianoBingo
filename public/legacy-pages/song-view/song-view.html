<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Reader</title>
  <link rel="stylesheet" href="./song-view.css" />
</head>
<body class="pdf-page" onload="load()">
  <nav>
    <button onclick="back()">Back</button>
    <h1 id="title"></h1>
  </nav>
  
  <div id="pdf-viewer">
    <span class="left" onclick="changePage(-1)"></span>
    <span class="right" onclick="changePage(1)"></span>
  </div>

  <script>
    function back(){
      startNewGame();
      loadPage(PAGE.SONG_MANAGEMENT);
    }

    function load(){
      loadPdf();
      const gamedata = getCurrentSong();
      document.getElementById("title").innerText = gamedata.songId.toString() + " - " + gamedata.title.toString()
    }
  </script>

  <!-- ✅ PDF.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- Import the external JS file containing the Base64 string -->
  <script src="/resources/base64/pack_tom.js"></script>
  <script src="/resources/base64/pack_jack.js"></script>

  <script src="./pdf-reader.js"></script>
  <script src="/services/navigation/navigation.js"></script>
  <script src="/resources/state-helpers/gameStorage.js"></script>  
</body>
</html>
